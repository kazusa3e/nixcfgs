name: Update flake lock

on:
  schedule:
    - cron: '23 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-flake-lock
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ github.token }}

      - name: Update lock and compare package versions
        id: update
        run: python3 -B scripts/update_flake_lock.py --output-dir "$RUNNER_TEMP/flake-update"

      - name: Check the updated flake without building
        if: steps.update.outputs.changed == 'true'
        run: nix flake check --no-build --all-systems --no-update-lock-file

      # Also run on no-change updates so obsolete PR branches can be cleaned up.
      - name: Create or refresh the update PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: ${{ github.event.repository.default_branch }}
          branch: automation/update-flake-lock
          delete-branch: true
          add-paths: flake.lock
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: ${{ steps.update.outputs.commit-message }}
          title: 'chore(deps): update flake inputs'
          body-path: ${{ runner.temp }}/flake-update/pr-body.md
